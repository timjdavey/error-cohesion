[project]
name = "error-cohesion"
version = "0.1.0"
description = "Cohesion and Incoherence in the Hot Mess setup: toy examples and the paper's own data"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "incoherence",
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
incoherence = { git = "https://github.com/timjdavey/incoherence", rev = "ba8e920101b0896fc2dbc4303385eb6fd113ff9c" }

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# Scripts import their siblings by name, and the toy and real data share measures.py.
known-first-party = ["load", "main", "measures"]
